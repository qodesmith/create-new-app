<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <!-- TODO - replace this with your actual favicon -->
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./src/app.css">

    <script type="module" src="./src/app.tsx"></script>
    <script>
      ;(() => {
        // 'ui-theme' is the same key used in globalState.ts for themeSettingAtom
        let theme = JSON.parse(localStorage.getItem('ui-theme') ?? '"system"')

        if (theme === 'system') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        }

        // Light mode is the default, so only set a class for dark mode.
        document.documentElement.classList.add(theme)
      })()
    </script>

    <title>{{PROJECT_NAME}}</title>
  </head>
  <body class="h-full antialiased">
    <div id="root" class="h-full"></div>
  </body>
</html>
